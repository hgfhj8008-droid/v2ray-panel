<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#a855f7">
<meta name="description" content="کانفیگ‌های V2Ray محمد">

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">

<title>کانفیگ‌های V2Ray محمد</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Vazirmatn,sans-serif;
    background:
        radial-gradient(circle at top,#24113d 0%,#0d0d17 42%,#050509 100%);
    color:#fff;
}

.container{
    width:min(700px,94%);
    margin:auto;
    padding:20px 0 40px;
}

.header{
    text-align:center;
    padding:20px 10px 15px;
}

.logo{
    width:72px;
    height:72px;
    margin:auto;
    border-radius:22px;
    box-shadow:0 10px 35px #0008;
}

h1{
    font-size:24px;
    margin:14px 0 8px;
}

.subtitle{
    color:#bbb;
    font-size:13px;
}

.date{
    margin:15px 0;
    padding:12px;
    border-radius:14px;
    background:#ffffff0d;
    border:1px solid #ffffff15;
    text-align:center;
    color:#ddd;
}

/* UPDATE */
.update-box{
    display:none;
    margin:15px 0;
    padding:18px;
    border-radius:20px;
    background:linear-gradient(135deg,#6d28d9,#a855f7);
    box-shadow:0 12px 35px #0007;
    animation:slideDown .4s ease;
}

.update-box.show{
    display:block;
}

.update-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.update-text{
    font-size:13px;
    line-height:2;
    color:#f5eaff;
}

.update-button{
    width:100%;
    margin-top:12px;
    padding:14px;
    border:0;
    border-radius:13px;
    background:#fff;
    color:#6d28d9;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

@keyframes slideDown{
    from{
        opacity:0;
        transform:translateY(-15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* INSTALL */
.install-button{
    width:100%;
    padding:14px;
    border:1px solid #ffffff20;
    border-radius:15px;
    background:#ffffff0c;
    color:white;
    font-size:14px;
    cursor:pointer;
    margin:5px 0 15px;
}

.install-button:active,
.update-button:active,
.copy-button:active{
    transform:scale(.98);
}

/* CONFIG */
.config{
    background:#ffffff0b;
    border:1px solid #ffffff14;
    border-radius:18px;
    padding:15px;
    margin:13px 0;
    box-shadow:0 8px 30px #0005;
}

.config-title{
    font-weight:bold;
    margin-bottom:10px;
    color:#eee;
}

.config-text{
    direction:ltr;
    text-align:left;
    word-break:break-all;
    background:#0007;
    border-radius:12px;
    padding:12px;
    font-size:11px;
    line-height:1.7;
    color:#ddd;
}

.copy-button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.actions{
    display:flex;
    gap:8px;
    margin:15px 0;
}

.actions button{
    flex:1;
    padding:12px;
    border:1px solid #ffffff18;
    border-radius:12px;
    background:#ffffff0c;
    color:#fff;
    cursor:pointer;
}

.footer{
    text-align:center;
    color:#777;
    font-size:11px;
    margin-top:30px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000b;
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(400px,100%);
    background:#171320;
    border:1px solid #ffffff18;
    border-radius:22px;
    padding:22px;
    text-align:center;
    box-shadow:0 20px 60px #000;
}

.modal-box h2{
    margin-top:0;
    font-size:19px;
}

.modal-box p{
    color:#bbb;
    font-size:13px;
    line-height:2;
}

.modal-buttons{
    display:flex;
    gap:10px;
}

.modal-buttons button{
    flex:1;
    padding:13px;
    border:0;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

.cancel{
    background:#ffffff12;
    color:white;
}

.confirm{
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    color:white;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <img class="logo" src="/icon.svg" alt="V2Ray">

        <h1>کانفیگ‌های V2Ray محمد</h1>

        <div class="subtitle">
            کانفیگ‌های جدید و به‌روز
        </div>
    </div>

    <div class="date" id="date"></div>

    <!-- UPDATE MESSAGE -->
    <div class="update-box" id="updateBox">

        <div class="update-title">
            🔥 کانفیگ جدید محمد منتشر شد
        </div>

        <div class="update-text">
            کانفیگ‌های جدید آماده دریافت هستند.
            برای دریافت آخرین کانفیگ‌ها روی دکمه زیر بزنید.
        </div>

        <button class="update-button" onclick="refreshForUpdate()">
            🔄 رفرش و دریافت کانفیگ جدید
        </button>

    </div>

    <!-- INSTALL -->
    <button
        class="install-button"
        id="installBtn"
        onclick="askInstallPermission()">
        📲 نصب برنامه روی گوشی
    </button>

    <div class="actions">
        <button onclick="selectAll()">
            ☑️ انتخاب همه
        </button>

        <button onclick="deselectAll()">
            ⬜ حذف انتخاب
        </button>
    </div>

    <div id="configs"></div>

    <div class="footer">
        ساخته شده توسط mohammed ❤️
    </div>

</div>

<!-- INSTALL MODAL -->
<div class="modal" id="confirmModal">

    <div class="modal-box">

        <h2>📲 نصب برنامه</h2>

        <p>
            آیا می‌خواهید برنامه
            <b>V2Ray محمد</b>
            روی گوشی شما نصب شود؟
        </p>

        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closeInstallModal()">
                ❌ لغو
            </button>

            <button
                class="confirm"
                onclick="confirmInstall()">
                ✅ بله، نصب کن
            </button>

        </div>

    </div>

</div>

<script>

/* =========================================================
   نسخه کانفیگ
   فقط وقتی کانفیگ‌ها را تغییر می‌دهی این عدد را تغییر بده.
   مثال:
   1 → نسخه اول
   2 → آپدیت بعدی
   3 → آپدیت بعدی
   ========================================================= */

const CONFIG_VERSION = "1";


/* =========================================================
   کانفیگ‌ها
   ========================================================= */

const configs = [

"vless://46c9f15e-c986-4e4e-a929-04e8c8d9c9cb@104.21.237.60:443?path=%2Fbad6302c8689%3Fu%3Dmohammed2&security=tls&encryption=none&host=swift-fern-8bb4.lunar-canyon-4759.workers.dev&fp=chrome&type=ws&sni=swift-fern-8bb4.lunar-canyon-4759.workers.dev#جدید - mohammed",

"vless://46c9f15e-c986-4e4e-a929-04e8c8d9c9cb@104.18.80.38:443?path=%2Fbad6302c8689%3Fu%3Dmohammed&security=tls&encryption=none&host=swift-fern-8bb4.lunar-canyon-4759.workers.dev&fp=chrome&type=ws&sni=swift-fern-8bb4.lunar-canyon-4759.workers.dev#mohammed 1",

"vless://46c9f15e-c986-4e4e-a929-04e8c8d9c9cb@104.24.159.213:443?path=%2Fbad6302c8689%3Fu%3Dmohammed-2&security=tls&encryption=none&host=bright-haven-7010.pages.dev&fp=chrome&type=ws&sni=bright-haven-7010.pages.dev#mohammed 2"

];


/* =========================================================
   تاریخ
   ========================================================= */

function toPersianNumber(str){

    return String(str).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);

}

function gregorianToJalali(gy,gm,gd){

    const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];

    let jy;

    if(gy>1600){
        jy=979;
        gy-=1600;
    }else{
        jy=0;
        gy-=621;
    }

    const gy2=gm>2 ? gy+1 : gy;

    let days=
        365*gy+
        Math.floor((gy2+3)/4)-
        Math.floor((gy2+99)/100)+
        Math.floor((gy2+399)/400)-
        80+
        gd+
        g_d_m[gm-1];

    jy+=33*Math.floor(days/12053);

    days%=12053;

    jy+=4*Math.floor(days/1461);

    days%=1461;

    if(days>365){

        jy+=Math.floor((days-1)/365);
        days=(days-1)%365;

    }

    let jm;

    if(days<186){
        jm=1+Math.floor(days/31);
    }else{
        jm=7+Math.floor((days-186)/30);
    }

    let jd;

    if(days<186){
        jd=1+(days%31);
    }else{
        jd=1+((days-186)%30);
    }

    return [jy,jm,jd];
}

const now=new Date();

const j=gregorianToJalali(
    now.getFullYear(),
    now.getMonth()+1,
    now.getDate()
);

document.getElementById("date").textContent =
    "📅 امروز: " +
    toPersianNumber(j[0]) +
    "/" +
    toPersianNumber(String(j[1]).padStart(2,"0")) +
    "/" +
    toPersianNumber(String(j[2]).padStart(2,"0"));


/* =========================================================
   نمایش کانفیگ‌ها
   ========================================================= */

const configContainer=document.getElementById("configs");

configs.forEach((config,index)=>{

    const box=document.createElement("div");

    box.className="config";

    box.innerHTML=`

        <div class="config-title">
            کانفیگ ${index+1}
        </div>

        <div class="config-text">
            ${escapeHtml(config)}
        </div>

        <button
            class="copy-button"
            onclick="copyConfig(${index},this)">
            📋 کپی کانفیگ
        </button>

    `;

    configContainer.appendChild(box);

});


function escapeHtml(text){

    const div=document.createElement("div");

    div.textContent=text;

    return div.innerHTML;

}


/* =========================================================
   کپی
   ========================================================= */

async function copyConfig(index,button){

    try{

        await navigator.clipboard.writeText(configs[index]);

        const old=button.textContent;

        button.textContent="✅ کپی شد";

        setTimeout(()=>{
            button.textContent=old;
        },1500);

    }catch(e){

        alert("کپی انجام نشد؛ دوباره امتحان کنید.");

    }

}


/* =========================================================
   انتخاب همه
   ========================================================= */

function selectAll(){

    configs.forEach(config=>{
        navigator.clipboard.writeText(config);
    });

    alert("✅ کانفیگ‌ها آماده کپی شدند.");

}

function deselectAll(){

    alert("انتخاب کانفیگ‌ها لغو شد.");

}


/* =========================================================
   سیستم تشخیص آپدیت
   ========================================================= */

const SAVED_VERSION_KEY="mohammed_config_version";

function checkConfigUpdate(){

    const oldVersion=
        localStorage.getItem(SAVED_VERSION_KEY);

    /*
       اولین ورود:
       نسخه فعلی را ذخیره می‌کنیم
       و پیام آپدیت نشان نمی‌دهیم.
    */

    if(!oldVersion){

        localStorage.setItem(
            SAVED_VERSION_KEY,
            CONFIG_VERSION
        );

        return;

    }

    /*
       اگر نسخه سایت با نسخه ذخیره شده
       متفاوت باشد یعنی کانفیگ جدید آمده.
    */

    if(oldVersion !== CONFIG_VERSION){

        document
            .getElementById("updateBox")
            .classList.add("show");

    }

}

function refreshForUpdate(){

    /*
       قبل از رفرش نسخه جدید را ذخیره می‌کنیم
       تا پیام دوباره ظاهر نشود.
    */

    localStorage.setItem(
        SAVED_VERSION_KEY,
        CONFIG_VERSION
    );

    location.reload(true);

}

checkConfigUpdate();


/* =========================================================
   PWA INSTALL
   ========================================================= */

let deferredPrompt=null;

const installBtn=
    document.getElementById("installBtn");

window.addEventListener(
    "beforeinstallprompt",
    e=>{

        e.preventDefault();

        deferredPrompt=e;

    }
);


function askInstallPermission(){

    document
        .getElementById("confirmModal")
        .classList.add("show");

}


function closeInstallModal(){

    document
        .getElementById("confirmModal")
        .classList.remove("show");

}


async function confirmInstall(){

    closeInstallModal();

    if(!deferredPrompt){

        alert(
            "برای نصب، از منوی مرورگر گزینه «افزودن به صفحه اصلی» یا «Install app» را انتخاب کنید."
        );

        return;

    }

    deferredPrompt.prompt();

    const result=
        await deferredPrompt.userChoice;

    if(result.outcome==="accepted"){

        installBtn.textContent=
            "✅ برنامه نصب شد";

    }

    deferredPrompt=null;

}


window.addEventListener(
    "appinstalled",
    ()=>{

        installBtn.textContent=
            "✅ برنامه نصب شده است";

    }
);


/* =========================================================
   SERVICE WORKER
   ========================================================= */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        async ()=>{

            try{

                const registration=
                    await navigator.serviceWorker.register(
                        "/sw.js?v=6",
                        {scope:"/"}
                    );

                /*
                   بررسی آپدیت سایت هنگام باز شدن
                */

                registration.update();

                /*
                   هر 5 دقیقه در صورت باز بودن صفحه
                   نسخه جدید را بررسی می‌کنیم.
                */

                setInterval(
                    ()=>{
                        registration.update();
                    },
                    5*60*1000
                );

            }catch(error){

                console.log(
                    "Service Worker error:",
                    error
                );

            }

        }
    );

}

</script>

</body>
</html>
