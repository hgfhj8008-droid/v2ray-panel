.config-header .small-date{font-size:10px;color:#666;background:#0d0d17;padding:4px 8px;border-radius:8px;font-family:monospace;direction:ltr}
.config-text{background:#0d0d17;border-radius:10px;padding:12px;font-size:11px;font-family:monospace;direction:ltr;text-align:left;color:#888;word-break:break-all;max-height:80px;overflow:hidden;margin-bottom:10px}

<script>
function toJalali(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053); days %= 12053;
  jy += 4*Math.floor(days/1461); days %= 1461;
  if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1)%365; }
  const jm = (days < 186) ? 1+Math.floor(days/31) : 7+Math.floor((days-186)/30);
  const jd = 1 + ((days < 186) ? (days%31) : ((days-186)%30));
  return {jy, jm, jd};
}
function getTodayJalali() {
  const now = new Date();
  const j = toJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
  return String(j.jy) + '/' + String(j.jm).padStart(2,'0') + '/' + String(j.jd).padStart(2,'0');
}

];
const list = document.getElementById('list');
configs.forEach((config, index) => {
const div = document.createElement('div');
div.className = 'config-item';
if (index === 0) div.classList.add('new-badge');
div.id = 'item-' + index;
const name = config.includes('#') ? decodeURIComponent(config.split('#')[1]) : ('کانفیگ ' + (index + 1));
const badge = index === 0 ? '<div class="badge-new">🆕 جدید</div>' : '';
div.innerHTML = badge + '<div class="config-header"><input type="checkbox" id="check-'+index+'" onchange="toggleItem('+index+')"><span class="name">'+name+'</span><span class="small-date">'+todayDate+'</span></div><div class="config-text">'+config+'</div><button class="copy-btn" onclick="copyOne('+index+', this)">📋 کپی این کانفیگ</button>';
list.appendChild(div);
});
function toggleItem(index) {
const item = document.getElementById('item-' + index);
const check = document.getElementById('check-' + index);
if (check.checked) item.classList.add('selected');
else item.classList.remove('selected');
}
function selectAll() { configs.forEach((_, i) => { document.getElementById('check-' + i).checked = true; toggleItem(i); }); }
function deselectAll() { configs.forEach((_, i) => { document.getElementById('check-' + i).checked = false; toggleItem(i); }); }
function copyOne(index, btn) { copyText(configs[index], btn); }
function copySelected() {
const selected = [];
configs.forEach((c, i) => { if (document.getElementById('check-' + i).checked) selected.push(c); });
if (selected.length === 0) { showToast('⚠️ هیچ کانفیگی انتخاب نشده!'); return; }
copyText(selected.join('\n\n'), null);
}
function copyText(text, btn) {
navigator.clipboard.writeText(text).then(() => {
if (btn) { const original = btn.textContent; btn.textContent = '✅ کپی شد!'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 2000); }
showToast('✅ کپی شد!');
}).catch(() => {
const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('✅ کپی شد!');
});
}
function showToast(msg) { const toast = document.getElementById('toast'); toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }
</script>

<script>
var deferredPrompt = null;

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  console.log('نصب آماده');
});

window.addEventListener('appinstalled', function() {
  var toast = document.getElementById('toast');
  if (toast) { toast.textContent = '✅ برنامه نصب شد!'; toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); }, 3000); }
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choice) {
      if (choice.outcome === 'accepted') {
        var toast = document.getElementById('toast');
        if (toast) { toast.textContent = '✅ نصب شد!'; toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); }, 3000); }
      }
      deferredPrompt = null;
    });
  } else {
    var toast = document.getElementById('toast');
    if (toast) { toast.textContent = '⚠️ مرورگر پشتیبانی نمی‌کنه - Chrome رو امتحان کن'; toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); }, 4000); }
    else { alert('از Chrome استفاده کن'); }
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(function() {
    console.log('SW ثبت شد');
  }).catch(function(e) {
    console.log('SW خطا:', e);
  });
}
</script>
