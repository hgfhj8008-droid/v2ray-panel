<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6d28d9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="کانفیگ‌های V2Ray محمد">

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">

<title>کانفیگ‌های V2Ray محمد</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Tahoma,Vazirmatn,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e1b4b,#312e81);
    color:#fff;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:18px 12px 35px;
}

.header{
    text-align:center;
    padding:20px 10px;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:10px 0 0;
    color:#cbd5e1;
    font-size:14px;
}

.version{
    display:inline-block;
    margin-top:12px;
    padding:6px 12px;
    border-radius:20px;
    background:rgba(255,255,255,.1);
    font-size:12px;
    color:#ddd;
}

.update-box{
    display:none;
    background:linear-gradient(135deg,#7c3aed,#9333ea);
    border:1px solid rgba(255,255,255,.25);
    border-radius:18px;
    padding:18px;
    margin:0 0 18px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    animation:pulseBox 1.5s infinite alternate;
}

@keyframes pulseBox{
    from{transform:scale(1)}
    to{transform:scale(1.01)}
}

.update-box h2{
    margin:0 0 8px;
    font-size:18px;
}

.update-box p{
    margin:0 0 14px;
    line-height:1.8;
    font-size:14px;
}

.update-btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:13px;
    background:#fff;
    color:#6d28d9;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
}

.copy-all{
    width:100%;
    border:0;
    border-radius:16px;
    padding:15px;
    margin-bottom:18px;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(37,99,235,.25);
}

.config-card{
    position:relative;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:16px;
    margin-bottom:15px;
    backdrop-filter:blur(12px);
    box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.config-card.new{
    border:2px solid #a855f7;
    box-shadow:
        0 0 0 2px rgba(168,85,247,.15),
        0 10px 35px rgba(168,85,247,.25);
}

.new-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:linear-gradient(135deg,#9333ea,#c026d3);
    color:white;
    padding:6px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:10px;
}

.config-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
}

.config-url{
    direction:ltr;
    text-align:left;
    background:rgba(0,0,0,.3);
    border-radius:12px;
    padding:12px;
    font-size:11px;
    line-height:1.7;
    word-break:break-all;
    color:#dbeafe;
    max-height:115px;
    overflow:auto;
    margin-bottom:12px;
}

.copy-btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:12px;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:14px;
    cursor:pointer;
}

.copy-btn:active,
.copy-all:active,
.update-btn:active,
.install-btn:active{
    transform:scale(.98);
}

.install-btn{
    width:100%;
    border:0;
    border-radius:16px;
    padding:14px;
    margin-top:3px;
    background:linear-gradient(135deg,#059669,#10b981);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#94a3b8;
    font-size:12px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(100px);
    background:#111827;
    color:white;
    padding:12px 20px;
    border-radius:30px;
    font-size:13px;
    z-index:9999;
    opacity:0;
    transition:.3s;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
    max-width:90%;
    text-align:center;
}

.toast.show{
    transform:translateX(-50%) translateY(0);
    opacity:1;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:10000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:400px;
    background:#1e1b4b;
    border:1px solid rgba(255,255,255,.15);
    border-radius:22px;
    padding:25px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.modal-box h3{
    margin-top:0;
}

.modal-box p{
    color:#cbd5e1;
    line-height:1.8;
    font-size:14px;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-buttons button{
    flex:1;
    border:0;
    border-radius:12px;
    padding:12px;
    cursor:pointer;
    font-weight:bold;
}

.install-confirm{
    background:#7c3aed;
    color:white;
}

.install-cancel{
    background:#374151;
    color:white;
}

@media(max-width:420px){
    .header h1{
        font-size:22px;
    }

    .container{
        padding:12px 10px 30px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>⚡ کانفیگ‌های V2Ray محمد</h1>
        <p>کانفیگ‌های جدید و سالم برای اتصال</p>
        <div class="version">
            نسخه کانفیگ: <span id="versionText"></span>
        </div>
    </div>

    <div id="updateBox" class="update-box">
        <h2>🔥 کانفیگ جدید محمد منتشر شد</h2>
        <p>
            کانفیگ‌های جدید اضافه شده‌اند.
            برای دریافت آخرین نسخه، صفحه را رفرش کنید.
        </p>
        <button class="update-btn" onclick="refreshForUpdate()">
            🔄 رفرش و دریافت کانفیگ جدید
        </button>
    </div>

    <button class="copy-all" onclick="copyAllConfigs()">
        📋 کپی همه کانفیگ‌ها
    </button>

    <div id="configs"></div>

    <button id="installBtn" class="install-btn" style="display:none;" onclick="openInstallModal()">
        📲 نصب برنامه روی گوشی
    </button>

    <div class="footer">
        ساخته شده توسط mohammed ❤️
    </div>

</div>

<div id="toast" class="toast"></div>

<div id="installModal" class="modal">
    <div class="modal-box">
        <h3>📲 نصب V2Ray محمد</h3>
        <p>
            آیا می‌خواهید برنامه V2Ray محمد روی گوشی شما نصب شود؟
        </p>

        <div class="modal-buttons">
            <button class="install-cancel" onclick="closeInstallModal()">
                لغو
            </button>

            <button class="install-confirm" onclick="installApp()">
                نصب
            </button>
        </div>
    </div>
</div>

<script>

/* =====================================================
   نسخه کانفیگ
   هر بار کانفیگ جدید اضافه کردی این عدد را تغییر بده
   ===================================================== */

const CONFIG_VERSION = "2";


/* =====================================================
   لیست کانفیگ‌ها
   کانفیگ جدید = isNew: true
   کانفیگ قدیمی = isNew: false
   ===================================================== */

const configs = [

    {
        name: "کانفیگ جدید",
        url: "vless://46c9f15e-c986-4e4e-a929-04e8c8d9c9cb@104.21.237.60:443?path=%2Fbad6302c8689%3Fu%3Dmohammed2&security=tls&encryption=none&host=swift-fern-8bb4.lunar-canyon-4759.workers.dev&fp=chrome&type=ws&sni=swift-fern-8bb4.lunar-canyon-4759.workers.dev#%D8%AC%D8%AF%DB%8C%D8%AF%20-%20mohammed",
        isNew: true
    },

    {
        name: "mohammed 1",
        url: "vless://46c9f15e-c986-4e4e-a929-04e8c8d9c9cb@104.18.80.38:443?path=%2Fbad6302c8689%3Fu%3Dmohammed&security=tls&encryption=none&host=swift-fern-8bb4.lunar-canyon-4759.workers.dev&fp=chrome&type=ws&sni=swift-fern-8bb4.lunar-canyon-4759.workers.dev#mohammed%201",
        isNew: false
    },

    {
        name: "mohammed 2",
        url: "vless://46c9f15e-c986-4e4e-a929-04e8c8d9c9cb@104.24.159.213:443?path=%2Fbad6302c8689%3Fu%3Dmohammed-2&security=tls&encryption=none&host=bright-haven-7010.pages.dev&fp=chrome&type=ws&sni=bright-haven-7010.pages.dev#mohammed%202",
        isNew: false
    }

];


/* =====================================================
   نمایش نسخه
   ===================================================== */

document.getElementById("versionText").textContent = CONFIG_VERSION;


/* =====================================================
   نمایش کانفیگ‌ها
   ===================================================== */

function renderConfigs(){

    const box = document.getElementById("configs");

    box.innerHTML = "";

    configs.forEach((config,index)=>{

        const card = document.createElement("div");

        card.className = "config-card" + (config.isNew ? " new" : "");

        card.innerHTML = `

            ${config.isNew ? `
                <div class="new-badge">
                    🆕 جدید
                </div>
            ` : ""}

            <div class="config-title">
                ${escapeHtml(config.name)}
            </div>

            <div class="config-url">
                ${escapeHtml(config.url)}
            </div>

            <button class="copy-btn" onclick="copyConfig(${index})">
                📋 کپی کانفیگ
            </button>

        `;

        box.appendChild(card);

    });

}


/* =====================================================
   جلوگیری از مشکل HTML
   ===================================================== */

function escapeHtml(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   کپی یک کانفیگ
   ===================================================== */

async function copyConfig(index){

    try{

        await navigator.clipboard.writeText(configs[index].url);

        showToast("✅ کانفیگ کپی شد");

    }catch(e){

        fallbackCopy(configs[index].url);

    }

}


/* =====================================================
   کپی همه کانفیگ‌ها
   ===================================================== */

async function copyAllConfigs(){

    const allConfigs = configs
        .map(config => config.url)
        .join("\n");

    try{

        await navigator.clipboard.writeText(allConfigs);

        showToast("✅ همه کانفیگ‌ها کپی شدند");

    }catch(e){

        fallbackCopy(allConfigs);

    }

}


/* =====================================================
   روش جایگزین کپی
   ===================================================== */

function fallbackCopy(text){

    const textarea = document.createElement("textarea");

    textarea.value = text;

    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";

    document.body.appendChild(textarea);

    textarea.select();

    try{

        document.execCommand("copy");

        showToast("✅ کپی شد");

    }catch(e){

        showToast("❌ کپی انجام نشد");

    }

    textarea.remove();

}


/* =====================================================
   پیام پایین صفحه
   ===================================================== */

let toastTimer;

function showToast(message){

    const toast = document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(()=>{

        toast.classList.remove("show");

    },2500);

}


/* =====================================================
   سیستم تشخیص نسخه جدید
   ===================================================== */

const VERSION_KEY = "mohammed_config_version";

const savedVersion = localStorage.getItem(VERSION_KEY);

if(savedVersion === null){

    localStorage.setItem(VERSION_KEY,CONFIG_VERSION);

}else if(savedVersion !== CONFIG_VERSION){

    document.getElementById("updateBox").style.display = "block";

}


/* =====================================================
   رفرش برای دریافت نسخه جدید
   ===================================================== */

function refreshForUpdate(){

    localStorage.setItem(VERSION_KEY,CONFIG_VERSION);

    window.location.reload(true);

}


/* =====================================================
   PWA نصب برنامه
   ===================================================== */

let deferredPrompt = null;

window.addEventListener("beforeinstallprompt",(e)=>{

    e.preventDefault();

    deferredPrompt = e;

    document.getElementById("installBtn").style.display = "block";

});


function openInstallModal(){

    if(!deferredPrompt){

        showToast("ℹ️ نصب برنامه در این مرورگر در دسترس نیست");

        return;

    }

    document.getElementById("installModal").style.display = "flex";

}


function closeInstallModal(){

    document.getElementById("installModal").style.display = "none";

}


async function installApp(){

    closeInstallModal();

    if(!deferredPrompt) return;

    deferredPrompt.prompt();

    const result = await deferredPrompt.userChoice;

    deferredPrompt = null;

    document.getElementById("installBtn").style.display = "none";

}


/* =====================================================
   بستن مودال با کلیک بیرون
   ===================================================== */

document.getElementById("installModal").addEventListener("click",(e)=>{

    if(e.target.id === "installModal"){

        closeInstallModal();

    }

});


/* =====================================================
   Service Worker
   ===================================================== */

if("serviceWorker" in navigator){

    window.addEventListener("load",async()=>{

        try{

            const registration =
                await navigator.serviceWorker.register("/sw.js?v=8");

            registration.update();

            setInterval(()=>{

                registration.update();

            },5 * 60 * 1000);

        }catch(error){

            console.log("Service Worker error:",error);

        }

    });

}


/* =====================================================
   شروع
   ===================================================== */

renderConfigs();

</script>

</body>
</html>
